name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # Push the less shards (refs/less/*) back to the remote.  This never
  # touches branches, and pushes made with GITHUB_TOKEN do not trigger new
  # workflow runs, so there is no recursion.  (Fork PRs get a read-only token
  # regardless; the pull-only sync mode below never attempts a push there.)
  contents: write

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: selection diffs the working tree against the
          # shard's recorded base commit, which a shallow checkout would
          # not contain (every run would degenerate to a full re-record).
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync

      - name: Run tests (less dogfood)
        env:
          # Record + push on push events.  On pull_request, consume
          # read-only instead: the PR checkout is a synthetic merge commit
          # that main runs cannot resolve as a base, and recording it would
          # poison the shared shard (forcing one full run back on main).
          PYTEST_LESS_SYNC: ${{ github.event_name == 'push' && '1' || 'pull:origin' }}
        run: |
          set +e
          uv run pytest --less -q tests
          code=$?
          set -e
          # Exit 5 = "no tests collected": nothing in this change affects
          # any test, which is a perfectly green outcome for a TIA run.
          if [ "$code" -eq 5 ]; then exit 0; fi
          exit "$code"

  tests:
    # The plain suite on every supported Python, with both git backends (the
    # in-process object layer and the forced `git` subprocess fallback it must
    # always be able to hand over to) and both block-hashing algorithms (the
    # default compiled-bytecode hasher and the AST one it falls back to per
    # file, and which owns the cosmetic docstring filter).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        git_backend: [auto, subprocess]
        hash: [bytecode, ast]
    env:
      PYTEST_LESS_GIT_BACKEND: ${{ matrix.git_backend }}
      PYTEST_LESS_HASH: ${{ matrix.hash }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -q tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dogfood:
    # The plugin's own suite through the plugin itself: the first run
    # records, the no-change rerun must select nothing (and exit 0).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync

      - name: Run tests (mortadelo dogfood)
        run: |
          uv run pytest --mortadelo -q tests   # records: everything runs
          uv run pytest --mortadelo -q tests   # nothing changed: 0 selected, exit 0

  tests:
    # The plain suite on every supported Python.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -q tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests demo
